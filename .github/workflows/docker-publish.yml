name: Build and Push Docker Image

on:
  push:
    branches:
      - main  

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: |
        IMAGE_TAG=${GITHUB_SHA::7}  # 7 premiers caractères du commit SHA
        docker build -t ba2664890/scrapyd-immo:$IMAGE_TAG .
        docker tag ba2664890/scrapyd-immo:$IMAGE_TAG ba2664890/scrapyd-immo:latest

    - name: Push Docker image
      run: |
        IMAGE_TAG=${GITHUB_SHA::7}
        docker push ba2664890/scrapyd-immo:$IMAGE_TAG
        docker push ba2664890/scrapyd-immo:latest
